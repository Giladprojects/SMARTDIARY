    <text x="1180" y="465" text-anchor="middle" font-size="26">מסד נתונים</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="270" y="120" width="760" height="660" rx="30" fill="#ffffff" stroke="#d4cabd" stroke-width="3"/>
  </g>
  <text x="650" y="160" text-anchor="middle" font-family="David, Arial, sans-serif" font-size="26" fill="#5b4c3d">מערכת SMARTDIARY</text>

  <g font-family="David, Arial, sans-serif" font-size="22" fill="#2f2f2f">
    <ellipse cx="470" cy="250" rx="120" ry="38" fill="#e5eef5" stroke="#96b5ca"/>
    <text x="470" y="258" text-anchor="middle">התחברות / הרשמה</text>
    <ellipse cx="760" cy="250" rx="120" ry="38" fill="#e5eef5" stroke="#96b5ca"/>
    <text x="760" y="258" text-anchor="middle">צפייה בלוח החודשי</text>

    <ellipse cx="470" cy="375" rx="120" ry="38" fill="#f4ead8" stroke="#cba66a"/>
    <text x="470" y="383" text-anchor="middle">הוספת אירוע</text>
    <ellipse cx="760" cy="375" rx="150" ry="38" fill="#f4ead8" stroke="#cba66a"/>
    <text x="760" y="383" text-anchor="middle">הוספת אירוע חוזר</text>

    <ellipse cx="470" cy="500" rx="140" ry="38" fill="#e6f0e5" stroke="#92b18f"/>
    <text x="470" y="508" text-anchor="middle">בדיקת חפיפה וקונפליקט</text>
    <ellipse cx="760" cy="500" rx="150" ry="38" fill="#e6f0e5" stroke="#92b18f"/>
    <text x="760" y="508" text-anchor="middle">הצעת חלופות והזזות</text>

    <ellipse cx="470" cy="625" rx="120" ry="38" fill="#efe4ef" stroke="#b79db7"/>
    <text x="470" y="633" text-anchor="middle">מחיקת אירוע</text>
    <ellipse cx="760" cy="625" rx="140" ry="38" fill="#efe4ef" stroke="#b79db7"/>
    <text x="760" y="633" text-anchor="middle">שמירה וטעינת נתונים</text>
  </g>

  <g stroke="#7d8b95" stroke-width="3" fill="none">
    <line x1="168" y1="272" x2="350" y2="250"/>
    <line x1="168" y1="272" x2="350" y2="375"/>
    <line x1="168" y1="272" x2="330" y2="500"/>
    <line x1="168" y1="272" x2="350" y2="625"/>

    <line x1="910" y1="500" x2="1140" y2="292"/>
    <line x1="900" y1="625" x2="1140" y2="292"/>
    <line x1="590" y1="500" x2="610" y2="500"/>
    <line x1="620" y1="375" x2="620" y2="470"/>
  </g>

  <text x="650" y="835" text-anchor="middle" font-family="David, Arial, sans-serif" font-size="22" fill="#5e5e5e">
    המשתמש מפעיל את מקרי השימוש, ומסד הנתונים מספק התמדה לכל תהליך יצירה, טעינה ועדכון
  </text>
