<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="900" viewBox="0 0 1300 900">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#6e6e6e" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="1300" height="900" fill="#f7f4ef"/>
  <text x="650" y="60" text-anchor="middle" font-family="David, Arial, sans-serif" font-size="34" fill="#2f3a43">תרשים מקרי שימוש</text>

  <g font-family="David, Arial, sans-serif" fill="#26343a">
    <circle cx="120" cy="210" r="28" fill="#2f6472"/>
    <line x1="120" y1="238" x2="120" y2="340" stroke="#2f6472" stroke-width="8"/>
    <line x1="72" y1="272" x2="168" y2="272" stroke="#2f6472" stroke-width="8"/>
    <line x1="120" y1="340" x2="78" y2="405" stroke="#2f6472" stroke-width="8"/>
    <line x1="120" y1="340" x2="162" y2="405" stroke="#2f6472" stroke-width="8"/>
    <text x="120" y="455" text-anchor="middle" font-size="26">משתמש</text>

    <circle cx="1180" cy="230" r="28" fill="#557e5a"/>
    <line x1="1180" y1="258" x2="1180" y2="350" stroke="#557e5a" stroke-width="8"/>
    <line x1="1132" y1="292" x2="1228" y2="292" stroke="#557e5a" stroke-width="8"/>
    <line x1="1180" y1="350" x2="1138" y2="415" stroke="#557e5a" stroke-width="8"/>
