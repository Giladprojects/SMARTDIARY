<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="980" viewBox="0 0 1300 980">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#7c7c7c" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="1300" height="980" fill="#f8f3ea"/>
  <text x="650" y="70" text-anchor="middle" font-family="David, Arial, sans-serif" font-size="34" fill="#2a3d3a">ארכיטקטורת SMARTDIARY בתצורת על-למטה</text>

  <g filter="url(#shadow)">
    <rect x="435" y="110" width="430" height="90" rx="24" fill="#1f4b4a"/>
    <text x="650" y="155" text-anchor="middle" font-family="David, Arial, sans-serif" font-size="28" fill="#fff">SMARTDIARY</text>
    <text x="650" y="186" text-anchor="middle" font-family="David, Arial, sans-serif" font-size="18" fill="#d9efe8">מערכת יומן חכמה לניהול אירועים, חזרתיות וקונפליקטים</text>
  </g>

  <line x1="650" y1="200" x2="650" y2="255" stroke="#7c8b7f" stroke-width="4"/>
  <line x1="240" y1="255" x2="1060" y2="255" stroke="#7c8b7f" stroke-width="4"/>
  <line x1="240" y1="255" x2="240" y2="286" stroke="#7c8b7f" stroke-width="4"/>
  <line x1="650" y1="255" x2="650" y2="286" stroke="#7c8b7f" stroke-width="4"/>
  <line x1="1060" y1="255" x2="1060" y2="286" stroke="#7c8b7f" stroke-width="4"/>

  <g filter="url(#shadow)">
    <rect x="80" y="286" width="320" height="510" rx="26" fill="#dfe8f0"/>
    <rect x="490" y="286" width="320" height="510" rx="26" fill="#ebdfcf"/>
    <rect x="900" y="286" width="320" height="510" rx="26" fill="#dce9dc"/>
  </g>

  <text x="240" y="340" text-anchor="middle" font-family="David, Arial, sans-serif" font-size="28" fill="#29465d">שכבת תצוגה</text>
  <text x="650" y="340" text-anchor="middle" font-family="David, Arial, sans-serif" font-size="28" fill="#5c4429">שכבת לוגיקה עסקית</text>
  <text x="1060" y="340" text-anchor="middle" font-family="David, Arial, sans-serif" font-size="28" fill="#2d5531">שכבת נתונים והתמדה</text>

  <g font-family="David, Arial, sans-serif" font-size="22" fill="#203040">
    <rect x="120" y="385" width="240" height="64" rx="16" fill="#ffffff"/>
    <text x="240" y="425" text-anchor="middle">מסך התחברות והרשמה</text>
    <rect x="120" y="470" width="240" height="64" rx="16" fill="#ffffff"/>
    <text x="240" y="510" text-anchor="middle">לוח שנה חודשי</text>
    <rect x="120" y="555" width="240" height="64" rx="16" fill="#ffffff"/>
    <text x="240" y="595" text-anchor="middle">טופס הוספת אירוע</text>
    <rect x="120" y="640" width="240" height="64" rx="16" fill="#ffffff"/>
    <text x="240" y="680" text-anchor="middle">רשימת אירועי היום</text>
  </g>

  <g font-family="David, Arial, sans-serif" font-size="22" fill="#3b2f1d">
    <rect x="530" y="385" width="240" height="64" rx="16" fill="#ffffff"/>
    <text x="650" y="425" text-anchor="middle">מנוע שיבוץ חכם</text>
    <rect x="530" y="470" width="240" height="64" rx="16" fill="#ffffff"/>
    <text x="650" y="510" text-anchor="middle">ניהול אירועים חוזרים</text>
    <rect x="530" y="555" width="240" height="64" rx="16" fill="#ffffff"/>
    <text x="650" y="595" text-anchor="middle">ניהול משתמש פעיל</text>
    <rect x="530" y="640" width="240" height="64" rx="16" fill="#ffffff"/>
    <text x="650" y="680" text-anchor="middle">אימות נתונים וסיסמאות</text>
  </g>

  <g font-family="David, Arial, sans-serif" font-size="22" fill="#28412b">
    <rect x="940" y="385" width="240" height="64" rx="16" fill="#ffffff"/>
    <text x="1060" y="425" text-anchor="middle">DatabaseManager</text>
    <rect x="940" y="470" width="240" height="64" rx="16" fill="#ffffff"/>
    <text x="1060" y="510" text-anchor="middle">DatabaseMigrationTool</text>
    <rect x="940" y="555" width="240" height="64" rx="16" fill="#ffffff"/>
    <text x="1060" y="595" text-anchor="middle">טבלאות users / events</text>
    <rect x="940" y="640" width="240" height="64" rx="16" fill="#ffffff"/>
    <text x="1060" y="680" text-anchor="middle">חזרתיות, משתתפים ומיגרציות</text>
  </g>

  <text x="650" y="870" text-anchor="middle" font-family="David, Arial, sans-serif" font-size="24" fill="#565656">
    התצוגה מקבלת קלט, הלוגיקה מקבלת החלטות בזמן אמת, ושכבת הנתונים שומרת את מצב המערכת באופן קבוע
  </text>
</svg>
